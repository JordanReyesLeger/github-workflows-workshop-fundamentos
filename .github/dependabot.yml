version: 2
updates:
  # Mantiene al día las versiones de las actions usadas en los workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "actions"

  # Mantiene al día los paquetes NuGet del proyecto de ejemplo.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "nuget"